name: Release packages

# Publishes @incantly/core, @incantly/tiptap and @incantly/generation to GitHub Packages
# (npm.pkg.github.com), private to the Incantly organization. Bump "version" in the
# three packages/*/package.json files, then push a tag that matches it, e.g. v0.2.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@incantly'
      - run: npm ci
      - name: Check the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for pkg in core tiptap generation; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "packages/$pkg is $version, but the tag is $GITHUB_REF_NAME"; exit 1
            fi
          done
      - run: npm run check
      - run: npm run release -- --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
