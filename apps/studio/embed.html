<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incantly embed</title>
    <style>
      body { margin: 0; padding: 24px; font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: #1f2430; background: #f4f5f7; }
      main { max-width: 760px; margin: 0 auto; }
      #figure { height: 440px; }
      pre { background: #fff; border: 1px solid #d5d7dd; border-radius: 8px; padding: 12px; overflow: auto; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>A figure in a page</h1>
      <p>This page mounts one figure with <code>createApp</code> from the SDK. Drag the point; the line under the figure shows the events the page receives.</p>
      <div id="figure"></div>
      <pre id="events" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/embed/main.ts"></script>
  </body>
</html>
